# Refresh the striping diagram index and previews every Monday (and on demand from the Actions tab).
name: Refresh striping diagrams
on:
  schedule:
    - cron: "17 13 * * 1"     # Mondays, 6:17 am Pacific
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"     # show the scripts' progress lines as they happen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Check the repo has what the scripts need
        run: |
          missing=0
          for f in scripts/build_striping.py scripts/match_blocks.py scripts/render_striping_previews.py data/streets.json; do
            if [ -f "$f" ]; then echo "found   $f"; else echo "MISSING $f"; missing=1; fi
          done
          exit $missing
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils && pip install pillow
      - name: Rebuild data/striping.json (and log what changed)
        run: python3 scripts/build_striping.py
      - name: Render previews for new or changed diagrams
        run: python3 scripts/render_striping_previews.py
      - name: Commit if anything changed
        if: always()            # keep whatever previews were made, even if the render step failed partway
        run: |
          git config user.name "striping-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/striping.json data/striping_review.csv data/striping_changes.json striping/previews; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "Refresh striping diagrams $(date -u +%Y-%m-%d)"
            git pull --rebase || true
            git push
          fi
